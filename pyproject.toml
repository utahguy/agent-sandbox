[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sandbox"
version = "0.1.0"
description = "Run AI coding agents in isolated, reproducible containers"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
agent-sandbox = "agent_sandbox.cli.main:main"
agent-sandbox-py = "agent_sandbox.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
